<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOIND WORKS ADMIN</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box}body{font-family:'DM Sans',sans-serif}.logo-font{font-family:'Bebas Neue',sans-serif}
.glass-heavy{background:rgba(12,16,13,.56);backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,.14)}
.glass-panel{background:rgba(255,255,255,.05);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.11)}
.glass-card{background:rgba(255,255,255,.04);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);box-shadow:0 50px 100px rgba(0,0,0,.5)}
.glass-input{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08)}
.admin-view{display:none}.admin-view.active{display:block}.admin-tab.active{color:#34d399;background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.25)}
dialog::backdrop{background:rgba(0,0,0,.78)}
@media(max-width:700px){header{height:auto!important;flex-direction:column!important;align-items:flex-start!important;padding-top:12px!important;padding-bottom:12px!important}header nav{width:100%;margin-left:0!important;overflow-x:auto}.admin-row{grid-template-columns:1fr!important;gap:10px!important}.admin-head{display:none!important}}
</style>
</head>
<body class="m-0 text-white min-h-screen bg-slate-950 bg-cover bg-center bg-fixed" style="background-image:linear-gradient(rgba(3,8,6,.72),rgba(3,8,6,.84)),url('https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=2000&q=80')">
<header class="h-16 glass-heavy flex items-center px-5 lg:px-8 gap-6 sticky top-0 z-30">
<a href="./work.html" class="logo-font text-3xl tracking-[.12em]">LOIND <span class="text-emerald-400">WORKS</span></a>
<nav class="flex items-center gap-2 ml-auto">
<button class="admin-tab active border border-white/10 rounded-lg px-3 py-2 text-[10px] font-mono" data-view="projects">PROJECTS</button>
<button class="admin-tab border border-white/10 rounded-lg px-3 py-2 text-[10px] font-mono" data-view="members">MEMBERS</button>
<a href="./work.html" class="border border-emerald-400/25 text-emerald-300 rounded-lg px-3 py-2 text-[10px] font-mono">WORKSPACE ↗</a>
<button id="logout" class="w-9 h-9 rounded-lg border border-white/10 text-white/50"><i class="fa-solid fa-right-from-bracket"></i></button>
</nav>
</header>

<main class="p-4 sm:p-7 lg:p-9 max-w-[1500px] mx-auto">
<section id="projectsView" class="admin-view active">
<div class="flex flex-col md:flex-row md:items-end justify-between gap-5 mb-7">
<div><p class="font-mono text-[10px] tracking-[.2em] text-emerald-400">SIGNAL HUB / ADMIN</p><h1 class="text-3xl font-bold mt-2">Project Management</h1><p class="text-xs text-white/35 mt-1">원본 디자인 안에서 프로젝트만 관리합니다.</p></div>
<button id="newProject" class="rounded-xl bg-emerald-400 text-slate-950 px-5 py-3 text-xs font-bold">+ 새 프로젝트</button>
</div>
<div class="glass-card rounded-2xl overflow-hidden">
<div class="admin-head admin-row grid grid-cols-[1.4fr_1fr_.8fr_.7fr_.7fr] gap-4 px-5 py-3 border-b border-white/8 text-[9px] font-mono text-white/30"><span>PROJECT</span><span>CLIENT</span><span>OWNER</span><span>STATUS</span><span>ACTION</span></div>
<div id="projectAdminList"></div>
</div>
</section>

<section id="membersView" class="admin-view">
<div class="mb-7"><p class="font-mono text-[10px] tracking-[.2em] text-emerald-400">SIGNAL HUB / MEMBERS</p><h1 class="text-3xl font-bold mt-2">Member Management</h1><p class="text-xs text-white/35 mt-1">사용자 역할과 회사를 수정합니다.</p></div>
<div class="glass-card rounded-2xl overflow-hidden">
<div class="admin-head admin-row grid grid-cols-[1fr_1.4fr_1fr_.7fr_.7fr] gap-4 px-5 py-3 border-b border-white/8 text-[9px] font-mono text-white/30"><span>NAME</span><span>EMAIL</span><span>COMPANY</span><span>ROLE</span><span>ACTION</span></div>
<div id="memberAdminList"></div>
</div>
</section>
</main>

<dialog id="projectDialog" class="w-[min(760px,94vw)] rounded-2xl glass-heavy text-white p-0">
<form id="projectForm" class="p-6 sm:p-8 space-y-5">
<div class="flex justify-between border-b border-white/8 pb-4"><div><p class="font-mono text-[9px] tracking-[.2em] text-emerald-400">PROJECT EDITOR</p><h2 id="dialogTitle" class="text-2xl font-bold mt-1">새 프로젝트</h2></div><button type="button" data-close class="text-white/40 text-xl">×</button></div>
<input id="projectId" type="hidden">
<div class="grid sm:grid-cols-2 gap-3">
<label class="space-y-1"><span class="text-[9px] text-white/35">프로젝트명</span><input id="title" required class="glass-input rounded-xl p-3 text-xs outline-none w-full"></label>
<label class="space-y-1"><span class="text-[9px] text-white/35">클라이언트</span><input id="client" required class="glass-input rounded-xl p-3 text-xs outline-none w-full"></label>
<label class="space-y-1"><span class="text-[9px] text-white/35">담당자</span><input id="ownerName" required class="glass-input rounded-xl p-3 text-xs outline-none w-full"></label>
<label class="space-y-1"><span class="text-[9px] text-white/35">마감일</span><input id="dueDate" type="date" class="glass-input rounded-xl p-3 text-xs outline-none w-full"></label>
<label class="space-y-1"><span class="text-[9px] text-white/35">상태</span><select id="status" class="glass-input rounded-xl p-3 text-xs outline-none w-full"><option value="planning">설계 중</option><option value="progress">진행 중</option><option value="review">확인 요청</option><option value="done">완료</option></select></label>
<label class="space-y-1"><span class="text-[9px] text-white/35">진행률</span><input id="progress" type="number" min="0" max="100" value="0" class="glass-input rounded-xl p-3 text-xs outline-none w-full"></label>
</div>
<label class="space-y-1 block"><span class="text-[9px] text-white/35">외부 담당자 이메일 · 쉼표 구분</span><input id="memberEmails" class="glass-input rounded-xl p-3 text-xs outline-none w-full"></label>
<label class="space-y-1 block"><span class="text-[9px] text-white/35">설명</span><textarea id="description" class="glass-input rounded-xl p-3 text-xs outline-none w-full min-h-24"></textarea></label>
<label class="space-y-1 block"><span class="text-[9px] text-white/35">단계 · 쉼표 구분</span><input id="stages" value="기획, 자료 수급, 제작, 검수, 승인, 납품" class="glass-input rounded-xl p-3 text-xs outline-none w-full"></label>
<div class="flex gap-2 justify-end pt-3"><button id="deleteProject" type="button" class="hidden mr-auto border border-rose-400/25 text-rose-300 rounded-xl px-4 py-3 text-xs">삭제</button><button type="button" data-close class="border border-white/10 rounded-xl px-4 py-3 text-xs">취소</button><button class="bg-white text-slate-950 rounded-xl px-5 py-3 text-xs font-bold">저장</button></div>
</form>
</dialog>

<script type="module" src="./assets/admin.js"></script>
</body></html>
